<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formulário</title>
</head>
<body>

<h2>Formulário</h2>

<input id="nome" placeholder="Seu nome"><br><br>
<input id="cachorro" placeholder="Nome do cachorro"><br><br>

<button onclick="enviar()">Enviar</button>

<script>
const canal = new BroadcastChannel("demonstracao");

function enviar() {
    canal.postMessage({
        nome: document.getElementById("nome").value,
        cachorro: document.getElementById("cachorro").value,
        horario: new Date().toLocaleTimeString()
    });

    alert("Dados enviados para a outra aba!");
}
</script>

</body>
</html>
