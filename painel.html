<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel</title>
</head>
<body>

<h2>Painel de Demonstração</h2>

<div id="resultado">
    Aguardando dados...
</div>

<script>
const canal = new BroadcastChannel("demonstracao");

canal.onmessage = (evento) => {
    const dados = evento.data;

    document.getElementById("resultado").innerHTML = `
        <h3>Nova informação recebida</h3>
        Nome: ${dados.nome}<br>
        Cachorro: ${dados.cachorro}<br>
        Horário: ${dados.horario}
    `;

    console.log(dados);
};
</script>

</body>
</html>
